[project]
name = "tokmd"
version = "1.0.0"
description = "Count tokens per section of a Markdown file, with the right tokenizer for your target platform (Claude, OpenAI, and more)."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Fabián Ferdgelis", email = "fferdgelis@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["tokenizer", "tokens", "markdown", "claude", "openai", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "click>=8.1",
    "markdown-it-py>=3.0",
    "ctok>=1.3",
    "tiktoken>=0.14",
]

[project.optional-dependencies]
verify = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/fferdgelis/tokmd"
Repository = "https://github.com/fferdgelis/tokmd"
Issues = "https://github.com/fferdgelis/tokmd/issues"

[project.scripts]
tokmd = "tokmd.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Sin esto, coverage.xml graba la ruta absoluta del host donde corrio
# pytest (C:\...\scratch\tokmd-<stamp>\src\tokmd) en su elemento <source>.
# El escaner de Sonar corre en un contenedor Docker distinto, donde esa
# ruta de Windows no existe -> no puede resolver ningun archivo y el gate
# de cobertura de codigo nuevo queda en OK sin medir nada (medido
# 2026-09-25). Con rutas relativas, el escaner las resuelve contra su
# propio sonar.sources sin importar donde corrio pytest.
relative_files = true
