sonar.projectKey=tokmd
sonar.projectName=tokmd
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/test_*.py
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/*.egg-info/**,**/.pytest_cache/**

# Ruta exacta, no comodín — lección de whatsapp-mcp (27/08/2026): el sensor
# de cobertura de Python no resuelve comodines bajo un montaje aparte.
sonar.python.coverage.reportPaths=/reports/coverage.xml

# El snapshot analizado sale de `git archive HEAD` y no lleva .git.
sonar.scm.disabled=true
